  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&display=swap"
    rel="stylesheet">
  <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              parchment: 'var(--color-parchment)',
              graphite: 'var(--color-graphite)',
              teal: {
                DEFAULT: 'var(--color-teal)',
                dark: 'var(--color-teal-dark)',
                light: 'var(--color-teal-light)'
              },
              sepia: {
                DEFAULT: 'var(--color-sepia)',
                dark: 'var(--color-sepia-dark)',
                light: 'var(--color-sepia-light)'
              }
            },
            fontFamily: {
              serif: ['Lora', 'serif'],
              display: ['Playfair Display', 'serif'],
            },
            animation: {
              'twinkle': 'twinkle 5s ease-in-out infinite',
              'float': 'float 20s linear infinite',
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              twinkle: {
                '0%, 100%': { opacity: 0.3, transform: 'scale(1)' },
                '50%': { opacity: 1, transform: 'scale(1.2)' },
              },
              float: {
                '0%': { transform: 'translateY(0) rotate(0deg)' },
                '100%': { transform: 'translateY(-100px) rotate(360deg)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-parchment: #FBF9F4;
        --color-graphite: #151515;
        --color-teal: #1F4E5F;
        --color-teal-dark: #163A47;
        --color-teal-light: #4A7C8F;
        --color-sepia: #B08968;
        --color-sepia-dark: #7F5539;
        --color-sepia-light: #D4B499;
      }
      
      .dark {
        /* Night style: deep charcoal/navy instead of pure black */
        --color-parchment: #0F172A; 
        --color-graphite: #F1F5F9;
        --color-teal: #38BDF8;
        --color-sepia: #FCD34D;
      }

      body {
        background-color: var(--color-parchment);
        color: var(--color-graphite);
        font-family: 'Lora', serif;
        transition: background-color 0.5s ease, color 0.5s ease;
        overflow-x: hidden;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Enhanced Cosmic Background - STATIC as requested */
      .cosmic-bg {
        background: linear-gradient(to bottom, #020617, #0f172a);
        position: relative;
      }
      
      .nebula {
        position: absolute;
        width: 100%;
        height: 100%;
        background: 
          radial-gradient(circle at 20% 30%, rgba(31, 78, 95, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(127, 85, 57, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 1) 0%, transparent 100%);
        pointer-events: none;
      }

      .stars-overlay {
        background-image: 
          radial-gradient(1px 1px at 25% 10%, #fff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 50% 40%, #fff, rgba(0,0,0,0)),
          radial-gradient(1.5px 1.5px at 10% 80%, #fff, rgba(0,0,0,0)),
          radial-gradient(1.5px 1.5px at 90% 20%, #fff, rgba(0,0,0,0)),
          radial-gradient(2px 2px at 75% 60%, #fff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 40% 90%, #fff, rgba(0,0,0,0));
        background-repeat: repeat;
        background-size: 300px 300px;
        opacity: 0.3; /* Subtle static starfield */
      }
    </style>

}
