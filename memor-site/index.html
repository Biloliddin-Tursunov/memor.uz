<!DOCTYPE html>
<html lang="uz">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Dynamic title and meta tags will be handled by React Helmet -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&display=swap"
    rel="stylesheet">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/favicon-light.svg" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Structured Data: WebSite & Sitelinks Search Box -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://memor.uz/",
      "name": "Me'mor",
      "alternateName": ["memor", "memor.uz"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://memor.uz/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>

  <!-- Structured Data: Site Navigation (Sitelinks) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "itemListElement": [
        {
          "@type": "SiteNavigationElement",
          "position": 1,
          "name": "ILM",
          "url": "https://memor.uz/uz/knowledge"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 2,
          "name": "Harakat",
          "url": "https://memor.uz/uz/action"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 3,
          "name": "Ijod",
          "url": "https://memor.uz/uz/creation"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 4,
          "name": "Biz haqimizda",
          "url": "https://memor.uz/uz/about"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 5,
          "name": "Aloqa",
          "url": "https://memor.uz/uz/contact"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 6,
          "name": "Qo'llab-quvvatlash",
          "url": "https://memor.uz/uz/support"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 7,
          "name": "Xabarlar",
          "url": "https://memor.uz/uz/news"
        }
      ]
    }
  </script>

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Me'mor",
      "url": "https://memor.uz/",
      "logo": "https://memor.uz/brand/logo-2025.svg",
      "sameAs": [
        "https://www.instagram.com/memor.uz_",
        "https://t.me/memor_space"
      ]
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
