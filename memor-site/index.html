  <title>Me'mor - Dunyoni go'zallashtirish uchun!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            parchment: 'var(--color-parchment)',
            graphite: 'var(--color-graphite)',
            teal: {
              DEFAULT: 'var(--color-teal)',
              dark: 'var(--color-teal-dark)'
            },
            sepia: {
              DEFAULT: 'var(--color-sepia)',
              dark: 'var(--color-sepia-dark)'
            }
          },
          fontFamily: {
            serif: ['Lora', 'serif'],
            display: ['Playfair Display', 'serif'],
          },
          backgroundImage: {
            'paper-texture': "none",
          }
        }
      }
    }
  </script>
  <style>
    :root {
      /* Light Mode: Crisp White & Sharp Black with Accents */
      --color-parchment: #FFFFFF;
      --color-graphite: #121212;

      /* Accents for Contrast (Light Mode) */
      --color-teal: #1F4E5F;
      /* Deep Muted Teal - Professional contrast */
      --color-teal-dark: #163A47;
      --color-sepia: #B08968;
      /* Antique Bronze - Historical contrast */
      --color-sepia-dark: #7F5539;
    }

    .dark {
      /* Dark Mode: Lighter Dark Grey & Soft White for better readability */
      --color-parchment: #1E1E1E;
      /* Lighter charcoal, not pitch black */
      --color-graphite: #F0F0F0;
      /* Bright white text */

      /* Accents for Contrast (Dark Mode) - brighter/gold */
      --color-teal: #4FD1C5;
      /* Bright Teal/Turquoise */
      --color-teal-dark: #2DD4BF;
      --color-sepia: #FCD34D;
      /* Bright Gold/Amber */
      --color-sepia-dark: #F59E0B;
    }

    body {
      background-color: var(--color-parchment);
      color: var(--color-graphite);
      font-family: 'Lora', serif;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--color-parchment);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--color-graphite);
      border: 2px solid var(--color-parchment);
      border-radius: 4px;
      opacity: 0.5;
    }
  </style>
