
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Me'mor - since 2023</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Courier+Prime:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/adobe-caslon-pro" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              space: {
                bg: '#050510',
                nebula: '#1a103c',
              },
              kraft: {
                DEFAULT: '#d5c5a3', 
                light: '#e6dcc5',
                dark: '#c4b087',
                shadow: '#8c7b58'
              },
              ink: {
                DEFAULT: '#1a1a1a',
                light: '#2d2d2d',
                blue: '#1e3a8a',
                red: '#7f1d1d'
              },
              paper: {
                white: '#f9f9f7'
              }
            },
            fontFamily: {
              serif: ['"Adobe Caslon Pro"', '"Cormorant Garamond"', 'serif'],
              typewriter: ['"Courier Prime"', 'monospace'],
              hand: ['"Patrick Hand"', 'cursive'],
            },
            boxShadow: {
              'floating': '0 20px 30px -10px rgba(0, 0, 0, 0.5)',
              'deep': '0 30px 60px -12px rgba(0, 0, 0, 0.8)',
              'inner-light': 'inset 0 0 20px rgba(255,255,255,0.1)'
            },
            animation: {
              'drift': 'drift 60s linear infinite',
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              drift: {
                '0%': { transform: 'translateY(0px)' },
                '100%': { transform: 'translateY(-1000px)' },
              }
            },
            backgroundImage: {
               'paper-texture': "url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIi8+CjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiMwMDAiIG9wYWNpdHk9IjAuMDUiLz4KPC9zdmc+')",
               'watercolor-blue': "radial-gradient(circle at 50% 0%, rgba(219, 234, 254, 0.8) 0%, rgba(255,255,255,0) 70%)",
               'watercolor-red': "radial-gradient(circle at 50% 0%, rgba(254, 226, 226, 0.8) 0%, rgba(255,255,255,0) 70%)",
               'watercolor-green': "radial-gradient(circle at 50% 0%, rgba(220, 252, 231, 0.8) 0%, rgba(255,255,255,0) 70%)",
               'watercolor-gold': "radial-gradient(circle at 50% 0%, rgba(254, 249, 195, 0.8) 0%, rgba(255,255,255,0) 70%)",
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050510;
        color: #1a1a1a;
        overflow-x: hidden;
      }

      /* Nebula Background */
      .nebula-bg {
        position: fixed;
        inset: 0;
        background: 
          radial-gradient(circle at 20% 30%, rgba(76, 29, 149, 0.25) 0%, transparent 40%),
          radial-gradient(circle at 80% 70%, rgba(180, 83, 9, 0.15) 0%, transparent 40%),
          radial-gradient(circle at 50% 50%, rgba(30, 58, 138, 0.2) 0%, transparent 60%);
        z-index: -2;
        pointer-events: none;
      }

      /* Realistic 3D Pin */
      .pin-3d {
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        box-shadow: 1px 2px 4px rgba(0,0,0,0.4);
        z-index: 20;
        left: 50%;
        transform: translateX(-50%);
        top: -7px;
      }
      .pin-3d::before { /* Highlight */
        content: '';
        position: absolute;
        top: 2px;
        left: 3px;
        width: 5px;
        height: 5px;
        background: rgba(255,255,255,0.6);
        border-radius: 50%;
        filter: blur(1px);
      }
      
      .pin-red { background: radial-gradient(circle at 30% 30%, #ef4444, #991b1b); }
      .pin-gold { background: radial-gradient(circle at 30% 30%, #fbbf24, #b45309); }
      .pin-silver { background: radial-gradient(circle at 30% 30%, #e5e7eb, #9ca3af); }
      .pin-blue { background: radial-gradient(circle at 30% 30%, #60a5fa, #1e3a8a); }
      .pin-green { background: radial-gradient(circle at 30% 30%, #22c55e, #15803d); }
      .pin-yellow { background: radial-gradient(circle at 30% 30%, #facc15, #a16207); }

      /* Curled Paper Effect */
      .paper-curl {
        position: relative;
        border-radius: 2px 2px 2px 15px; /* Softer curl */
      }
      .paper-curl::before {
        content: '';
        position: absolute;
        bottom: 5px;
        right: 5px;
        width: 15px;
        height: 15px;
        background: linear-gradient(135deg, transparent 45%, rgba(0,0,0,0.05) 50%, rgba(255,255,255,0.4) 55%, transparent 60%);
        box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        z-index: 5;
        pointer-events: none;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>

  }
}
</script>
